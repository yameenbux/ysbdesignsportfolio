<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="YSB Designs">
  <!-- The wheel: a circle whose centre sits below the frame, with the card at
       top dead centre picked out in the accent. Same mark as the site's
       signature; palette is the drafting-table one. -->
