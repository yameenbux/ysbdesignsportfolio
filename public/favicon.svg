  <circle cx="16" cy="30" r="14" fill="none" stroke="#16191C" stroke-width="1.4" opacity="0.28"/>
  <rect x="4.4" y="24.2" width="7.6" height="5.6" rx="1" fill="#FBFAF7" stroke="#16191C" stroke-width="1.1" opacity="0.5" transform="rotate(-40 8.2 27)"/>
  <rect x="20" y="24.2" width="7.6" height="5.6" rx="1" fill="#FBFAF7" stroke="#16191C" stroke-width="1.1" opacity="0.5" transform="rotate(40 23.8 27)"/>
  <rect x="11.2" y="12.2" width="9.6" height="7.4" rx="1" fill="#FBFAF7" stroke="#1F45CC" stroke-width="1.8"/>
</svg>
